{% extends 'base.html' %}{% block body %}<section class="panel"><h2>Add a note</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title</label><input name="title" required maxlength="120"><label>Content</label><textarea name="content" rows="4" required maxlength="10000"></textarea><button>Save note</button></form></section><section class="panel"><h2>Your notes</h2><form method="get"><input name="q" value="{{ query }}" placeholder="Search titles"><button>Search</button></form>{% for note in notes %}<article><h3><a href="{{ url_for('note_detail', note_id=note.id) }}">{{ note.title }}</a></h3><p>{{ note.content }}</p><form method="post" action="{{ url_for('delete_note', note_id=note.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Delete</button></form><hr></article>{% else %}<p>No notes yet.</p>{% endfor %}</section>{% endblock %}
