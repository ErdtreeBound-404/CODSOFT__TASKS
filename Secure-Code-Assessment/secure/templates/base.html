<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student Notes Portal</title><style>
body{font-family:Arial,sans-serif;background:#f3f6fb;color:#172033;margin:0}.wrap{max-width:850px;margin:40px auto;padding:24px}.panel{background:white;padding:24px;border-radius:14px;box-shadow:0 8px 30px #10204012;margin:14px 0}input,textarea{box-sizing:border-box;width:100%;padding:11px;margin:7px 0 14px;border:1px solid #cbd5e1;border-radius:7px}button,.btn{background:#174ea6;color:white;border:0;padding:10px 15px;border-radius:7px;cursor:pointer;text-decoration:none}a{color:#174ea6}.flash{background:#fff4cc;padding:10px;border-radius:6px;margin:8px 0}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
</style></head><body><main class="wrap"><header><h1>Student Notes Portal</h1>{% if session.get('user_id') %}<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Log out</button></form>{% endif %}</header>{% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}{% block body %}{% endblock %}</main></body></html>
